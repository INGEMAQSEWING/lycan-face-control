[pytest]
testpaths = pruebas
addopts = -m "not manual"
markers =
    manual: pruebas con la cámara, el ratón o la voz reales (se excluyen por defecto)
    mediapipe: pruebas que cargan mediapipe (se saltan si no está instalado)
filterwarnings =
    ignore::DeprecationWarning
    ignore:SymbolDatabase.GetPrototype:UserWarning
